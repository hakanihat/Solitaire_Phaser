<!doctype html>
<!-- itch.io cover (630×500). Render at 2× in a browser and screenshot: marketing/itch-cover.png.
     Nunito is licensed under the SIL Open Font License. -->
<html><head><meta charset="utf-8">

<style>
  @font-face { font-family: "NunitoLocal"; src: url(nunito.woff2) format("woff2"); font-weight: 200 1000; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 630px; height: 500px; overflow: hidden; background: #0b3d24; }
  .cover { position: relative; width: 630px; height: 500px; overflow: hidden; font-family: "NunitoLocal", sans-serif;
    background: radial-gradient(ellipse 75% 70% at 50% 38%, #2fa56a 0%, #1f7a4d 38%, #0e4a2c 72%, #072617 100%); }
  .felt { position: absolute; inset: 0; opacity: .35; mix-blend-mode: overlay; }
  .lattice { position: absolute; inset: 0; opacity: .07;
    background-image: linear-gradient(45deg, #fff 1px, transparent 1px), linear-gradient(-45deg, #fff 1px, transparent 1px);
    background-size: 34px 34px; mask-image: radial-gradient(ellipse at 50% 40%, #000 20%, transparent 75%); }
  .rays { position: absolute; left: 50%; top: 170px; width: 900px; height: 900px; margin: -450px 0 0 -450px;
    background: repeating-conic-gradient(from 0deg, rgba(255,214,102,.16) 0deg 6deg, transparent 6deg 18deg);
    mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 18%, transparent 45%); }
  .glow { position: absolute; left: 50%; top: 175px; width: 460px; height: 300px; margin: -150px 0 0 -230px;
    background: radial-gradient(ellipse, rgba(255,220,120,.55), rgba(255,200,80,.15) 45%, transparent 70%); filter: blur(6px); }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 75% at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%); }

  .card { position: absolute; width: 112px; height: 161px; border-radius: 7px;
    background-image: url(../assets/img/cards2.png); background-size: 1400% 400%;
    box-shadow: 0 10px 22px rgba(0,0,0,.45), 0 2px 5px rgba(0,0,0,.35); transform-origin: 50% 145%; }
  .fan .card { left: 259px; top: 70px; }
  .far { filter: blur(2.2px) brightness(.8); box-shadow: 0 10px 20px rgba(0,0,0,.5); }

  .suit { position: absolute; font-family: "DejaVu Sans", sans-serif; color: #ffd54f; line-height: 1;
    text-shadow: 0 0 8px rgba(255,190,40,.9), 0 0 18px rgba(255,170,0,.5); }
  .spark { position: absolute; width: 18px; height: 18px; margin: -9px;
    background: radial-gradient(circle, #fff 0 12%, transparent 13%),
      linear-gradient(0deg, transparent 45%, rgba(255,245,200,.95) 50%, transparent 55%),
      linear-gradient(90deg, transparent 45%, rgba(255,245,200,.95) 50%, transparent 55%);
    filter: drop-shadow(0 0 4px #ffd54f); }

  .title { position: absolute; left: 0; right: 0; top: 268px; text-align: center; font-weight: 900; font-size: 92px;
    letter-spacing: -1px; color: #fff; line-height: 1;
    background: linear-gradient(#ffffff 30%, #fff1c4 70%, #ffd76a); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 0 rgba(0,0,0,.35)) drop-shadow(0 8px 16px rgba(0,0,0,.5)); }
  .subrow { position: absolute; left: 0; right: 0; top: 370px; display: flex; align-items: center; justify-content: center; gap: 14px; }
  .subtitle { font-weight: 900; font-size: 21px;
    letter-spacing: 5px; margin-right: -5px; color: #ffd54f; text-shadow: 0 0 10px rgba(255,180,0,.55), 0 2px 3px rgba(0,0,0,.6); }
  .rule { width: 54px; height: 2px; background: linear-gradient(90deg, transparent, #ffd54f); }
  .rule.r { transform: scaleX(-1); }
  .pill { position: absolute; left: 50%; top: 418px; transform: translateX(-50%); white-space: nowrap;
    padding: 9px 22px; border-radius: 99px; font-weight: 800; font-size: 17px; color: #fff;
    background: linear-gradient(rgba(10,15,22,.62), rgba(10,15,22,.78)); border: 1.5px solid rgba(255,213,79,.7);
    box-shadow: 0 6px 14px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12); }
  .pill b { color: #ffd54f; margin: 0 8px; }
  svg.frame { position: absolute; inset: 0; }
</style></head>
<body><div class="cover">
  <svg class="felt" width="630" height="500"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div class="lattice"></div>
  <div class="rays"></div>
  <div class="glow"></div>

  <!-- Depth cards drifting in the corners -->
  <div class="card far" style="left:-26px; top:250px; transform: rotate(-24deg) scale(.9); background-position: 46.15% 33.33%"></div>
  <div class="card far" style="left:540px; top:215px; transform: rotate(21deg) scale(.9); background-position: 69.23% 66.67%"></div>
  <div class="card far" style="left:18px; top:-70px; transform: rotate(14deg) scale(.75); background-position: 100% 33.33%"></div>
  <div class="card far" style="left:505px; top:-60px; transform: rotate(-16deg) scale(.75); background-position: 23.08% 0%"></div>

  <!-- Hero fan: back, J♦, Q♣, K♥, A♠ -->
  <div class="fan">
    <div class="card" style="transform: rotate(-32deg); background-position: 100% 33.33%"></div>
    <div class="card" style="transform: rotate(-16deg); background-position: 76.92% 33.33%"></div>
    <div class="card" style="transform: rotate(0deg); background-position: 84.62% 66.67%"></div>
    <div class="card" style="transform: rotate(16deg); background-position: 92.31% 0%"></div>
    <div class="card" style="transform: rotate(32deg); background-position: 0% 100%;
      box-shadow: 0 0 0 2px rgba(255,213,79,.9), 0 0 22px rgba(255,200,60,.8), 0 12px 24px rgba(0,0,0,.45)"></div>
  </div>

  <!-- Suit particles -->
  <div class="suit" style="left:132px; top:92px; font-size:30px; transform: rotate(-15deg)">♠</div>
  <div class="suit" style="left:470px; top:78px; font-size:26px; transform: rotate(12deg)">♥</div>
  <div class="suit" style="left:95px; top:196px; font-size:20px; opacity:.8">♦</div>
  <div class="suit" style="left:505px; top:180px; font-size:22px; opacity:.85; transform: rotate(-10deg)">♣</div>
  <div class="suit" style="left:175px; top:38px; font-size:14px; opacity:.7">♥</div>
  <div class="suit" style="left:430px; top:30px; font-size:15px; opacity:.7">♦</div>
  <div class="suit" style="left:60px; top:400px; font-size:18px; opacity:.55">♣</div>
  <div class="suit" style="left:555px; top:405px; font-size:18px; opacity:.55">♠</div>
  <div class="spark" style="left:420px; top:70px"></div>
  <div class="spark" style="left:205px; top:130px; transform: scale(.7)"></div>
  <div class="spark" style="left:455px; top:215px; transform: scale(.8)"></div>
  <div class="spark" style="left:150px; top:250px; transform: scale(.6)"></div>
  <div class="spark" style="left:365px; top:36px; transform: scale(.55)"></div>

  <div class="vignette"></div>

  <div class="title">Solitaire</div>
  <div class="subrow"><span class="rule"></span><span class="subtitle">COLLECTION · 10 GAMES</span><span class="rule r"></span></div>
  <div class="pill">Every deal winnable<b>✦</b>No ads</div>

  <!-- Ornate gold frame, same language as the in-game menu frames -->
  <svg class="frame" width="630" height="500" viewBox="0 0 630 500">
    <defs><linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4c2"/><stop offset=".45" stop-color="#ffd54f"/><stop offset="1" stop-color="#a8740a"/></linearGradient></defs>
    <rect x="8" y="8" width="614" height="484" rx="18" fill="none" stroke="rgba(0,0,0,.5)" stroke-width="8"/>
    <rect x="8" y="8" width="614" height="484" rx="18" fill="none" stroke="url(#gold)" stroke-width="5"/>
    <rect x="20" y="20" width="590" height="460" rx="10" fill="none" stroke="rgba(255,228,140,.5)" stroke-width="1.5"/>
    <g fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round">
      <path d="M30 80 V30 H80"/><path d="M550 30 H600 V80"/><path d="M600 420 V470 H550"/><path d="M80 470 H30 V420"/>
    </g>
    <g fill="url(#gold)">
      <path d="M30 22 L38 30 L30 38 L22 30Z"/><path d="M600 22 L608 30 L600 38 L592 30Z"/>
      <path d="M600 462 L608 470 L600 478 L592 470Z"/><path d="M30 462 L38 470 L30 478 L22 470Z"/>
    </g>
  </svg>
</div></body></html>
